<script>
window.__log = [];
function L(m){ try{ window.__log.push(String(m)); document.getElementById('log').textContent = window.__log.slice(-6).join("\n"); }catch(e){} }
window.__t = {
  env: () => ({ url: location.href, hasShopify: typeof shopify !== 'undefined',
                keys: (typeof shopify !== 'undefined') ? Object.keys(shopify) : [],
                scopesKeys: (typeof shopify !== 'undefined' && shopify.scopes) ? Object.keys(shopify.scopes) : [] }),
  idToken: async () => { try { return { ok:true, tok: await shopify.idToken() }; } catch(e){ return {ok:false, err:String(e)}; } },
  query: async () => { try { return { ok:true, v: await shopify.scopes.query() }; } catch(e){ return {ok:false, err:String(e)}; } },
  request: async (s) => { try { return { ok:true, v: await shopify.scopes.request(s) }; } catch(e){ return {ok:false, err:String(e)}; } },
  revoke: async (s) => { try { return { ok:true, v: await shopify.scopes.revoke(s) }; } catch(e){ return {ok:false, err:String(e)}; } },
  gql: async (q, v, ver) => {
    const url = 'shopify:admin/api/' + (ver || '2026-10') + '/graphql.json';
    try {
      const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'},
                                  body: JSON.stringify({query:q, variables:v||null})});
      const t = await r.text();
      return { status: r.status, url, body: t.slice(0, 4000) };
    } catch(e) { return { status:-1, url, err: String(e) }; }
  },
  raw: async (url, opts) => { try { const r = await fetch(url, opts||{}); const t = await r.text();
      return {status:r.status, body:t.slice(0,2000)}; } catch(e){ return {status:-1, err:String(e)}; } },
  title: () => document.title
};
